<!--DOM Projects with CSS-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Projects</title>
  <style>
    body {
      font-family: Arial;
    }
    .subscribe-button {
      border: none;
      background-color: black;
      color: white;
      padding: 10px;
      font-weight: bold; 
      border-radius: 50px;
      cursor: pointer;
      margin-bottom: 30px;

    }
    .is-subscribed {
      background-color: rgb(206, 202, 202);
      color: black;
    }
    .js-cost-input {
      font-size: 15px;
      padding: 10px;

    }
    .calculate-button {
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      padding: 12px 15px;
      cursor: pointer;

    }
  </style>
</head>
<body>
  <p>YouTube Subscribe Button</p>
  <button onclick="subscribe()" class="subscribe-button">Subscribe</button>

  <p>Amazon Shipping Calculator</p>
  <p>Order under $40= +$10 shipping.</p>
  <p>Order over $40= FREE shipping.</p>
  <input placeholder="Cost of Order" class="js-cost-input" onkeydown="handleCostKeydown(event)">
  <button onclick="calculateTotal()" class="calculate-button">Calculate</button>
  <p class="js-total-cost"></p>
  
  <script>
    //1. prefered to use innerText to innerHTML because the latter considers the whitespaces i.e <button> Subscribe </button> & so when comparing it(like in the if() below) will not be equal even though the text are the same

    //2. clicks & keydowns => events
    //onclick & onkeydown => event listeners
    //others are; onscroll, onmouseenter(hovering over), onmouseleave(stop hovering)

    //3. window represents whatever is in a browser i.e
    window.console
    window.document
    window.alert //this is for popups

    function handleCostKeydown(event) {
      if(event.key === 'Enter') {
        calculateTotal();
      }
    }
    
    function calculateTotal() {
      let cost = Number(document.querySelector('.js-cost-input').value); //4. value from DOM is a string thus using Number()

      if(cost < 40) {
        cost = cost+10;

      }
      
      document.querySelector('.js-total-cost').innerHTML=`$${cost}`;
      
    }

    function subscribe() {
      const buttonElement = document.querySelector('.subscribe-button');

      if(buttonElement.innerText === 'Subscribe') {
        buttonElement.innerHTML='Subscribed';
        //classList allows us to add/remove a class & then style it i.e
        buttonElement.classList.add('is-subscribed');

      } else {
        buttonElement.innerHTML='Subscribe';
        buttonElement.classList.remove('is-subscribed');
      }
      
    }
  </script>
</body>
</html>
