<!--Rock Paper Scissors Game-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors Game</title>
</head>
<body>
  <p>Rock Paper Scissors Game</p>
  <button onclick="
    const randomNumber = Math.random();
    let computerMove = '';

    if(randomNumber>=0 && randomNumber<1/3) {
      computerMove = 'rock';      
    } else if (randomNumber>=1/3 && randomNumber<2/3) {
      computerMove = 'paper';
    } else if (randomNumber>=2/3 && randomNumber<1){
      computerMove = 'scissors';
    }
    if(computerMove === 'rock') {
      alert('You played rock. Computer played rock. It\' a tie.');
    } else if(computerMove === 'paper'){
      alert('You played rock. Computer played paper. You lose.');
    } else {
      alert('You played rock. Computer played scissors. You win');
    }
  ">Rock</button>
  <button onclick="
    const randomNumber = Math.random();
    let computerMove = '';

    if(randomNumber>=0 && randomNumber<1/3) {
      computerMove = 'rock';      
    } else if (randomNumber>=1/3 && randomNumber<2/3) {
      computerMove = 'paper';
    } else if (randomNumber>=2/3 && randomNumber<1){
      computerMove = 'scissors';
    }
    if(computerMove === 'rock') {
      alert('You played paper. Computer played rock. You win.');
    } else if(computerMove === 'paper'){
      alert('You played paper. Computer played paper. It\'s a tie.');
    } else {
      alert('You played paper. Computer played scissors. You lose.');
    }
  ">Paper</button>
  <button onclick="
    const randomNumber = Math.random();
    let computerMove = '';

    if(randomNumber>=0 && randomNumber<1/3) {
      computerMove = 'rock';      
    } else if (randomNumber>=1/3 && randomNumber<2/3) {
      computerMove = 'paper';
    } else if (randomNumber>=2/3 && randomNumber<1){
      computerMove = 'scissors';
    }
    if(computerMove === 'rock') {
      alert('You played scissors. Computer played rock. You lose.');
    } else if(computerMove === 'paper'){
      alert('You played scissors. Computer played paper. You win.');
    } else {
      alert('You played scissors. Computer played scissors. It\'s a tie.');
    }
  ">Scissors</button>
  
  <script>

    
  </script>
</body>
</html>
