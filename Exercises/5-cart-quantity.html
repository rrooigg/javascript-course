<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

    <button onclick="
      if(cartQuantity<10) {
        cartQuantity++;
        console.log(`Cart quantity: ${cartQuantity}`);
      } else {
        alert('the cart is full.');
      }
    ">Add to Cart</button>

    <button onclick="
      if(cartQuantity<10) {
        cartQuantity += 2;
        console.log(`Cart quantity: ${cartQuantity}`);
      } else {
        alert('the cart is full.');
      }
    ">+2</button>

    <button onclick="
      if(cartQuantity<10) {
        cartQuantity = cartQuantity + 3;
        console.log(`Cart quantity: ${cartQuantity}`);
      } else {
        alert('the cart is full.');
      }
    ">+3</button>

    <button onclick="
      if(cartQuantity<10) {
        cartQuantity += 4;
        console.log(`Cart quantity: ${cartQuantity}`);
      } else {
        alert('the cart is full.');
      }
    ">+4</button>

    <button onclick="
      cartQuantity = cartQuantity - 1;
      console.log(`Cart quantity: ${cartQuantity}`);
      ">Remove from cart</button>

    <button onclick="
      if(cartQuantity===0) {
        alert('not enough to items in cart');
      } else {
        cartQuantity = cartQuantity - 2;
        console.log(`Cart quantity: ${cartQuantity}`);
      }
    ">-2</button>

    <button onclick="
      if(cartQuantity===0) {
        alert('not enough to items in cart');
      } else {
        cartQuantity = cartQuantity - 3;
        console.log(`Cart quantity: ${cartQuantity}`);
      }
    ">-3</button>

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Reset Cart</button>

    <script>
      let cartQuantity = 0;
    </script>
  </body>
</html>
