<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

    <button onclick="
      addToCartQuantity(1);
    ">Add to Cart</button>

    <button onclick="
      addToCartQuantity(2);
    ">+2</button>

    <button onclick="
      addToCartQuantity(3);
    ">+3</button>

    <button onclick="
      addToCartQuantity(4);
    ">+4</button>

    <button onclick="
      addToCartQuantity(5);
    ">+5</button>

    <button onclick="
      removeFromCartQuantity(1);
    ">Remove from cart</button>

    <button onclick="
      removeFromCartQuantity(2);
    ">-2</button>

    <button onclick="
      removeFromCartQuantity(3);
    ">-3</button>

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Reset Cart</button>

    <script>
      let cartQuantity = 0;
      function addToCartQuantity(number) {
        if (cartQuantity + number > 10) {
        return alert('The cart is full');
        } else {
        cartQuantity += number;
        console.log(`Cart quantity: ${cartQuantity}`);
          }
      }

      function removeFromCartQuantity(number) {
        if (cartQuantity - number < 0) {
        return alert('Not enough items in the cart');
        } else {
        cartQuantity -= number;
        console.log(`Cart quantity: ${cartQuantity}`);
          }
      }
    </script>
  </body>
</html>
