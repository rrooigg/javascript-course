<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5</title>
</head>
<body>
  <!--Excerise 7 Part 2--> <!--eval(..) turns the string to actual math-->
  <p class="js-calculator"></p>
  <p>
    <button onclick="calculate('1')">1</button>
    <button onclick="calculate('2')">2</button>
    <button onclick="calculate('3')">3</button>
    <button onclick="calculate('+')">+</button>
  </p>

  <p>
    <button onclick="calculate('4')">4</button>
    <button onclick="calculate('5')">5</button>
    <button onclick="calculate('6')">6</button>
    <button onclick="calculate('-')">-</button>
  </p>
  <p>
    <button onclick="calculate('7')">7</button>
    <button onclick="calculate('8')">8</button>
    <button onclick="calculate('9')">9</button>
    <button onclick="calculate('*')">*</button>
  </p>
  <p>
    <button onclick="calculate('0')">0</button>
    <button onclick="calculate('.')">.</button>
    <button onclick="calculation=eval(calculation);
      document.querySelector('.js-calculator').innerHTML=calculation;;
      localStorage.setItem('calculation', calculation)">=</button>
    <button onclick="calculate('/')">/</button>
    
  </p>
  <!--Add a Clear button-->
  <button onclick="calculation=' ';
    document.querySelector('.js-calculator').innerHTML=calculation;
    localStorage.setItem('calculation', calculation)">Clear</button>

  <script>
    //Excerise 5 Part
    let calculation = localStorage.getItem('calculation') ||'';

    function calculate(value) {
      calculation+=value;
      document.querySelector('.js-calculator').innerHTML=calculation;

      localStorage.setItem('calculation', calculation);

    }

  </script>
</body>
</html>
