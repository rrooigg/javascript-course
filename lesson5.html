<!--Variables-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Variables</title>
</head>
<body>
  <script>
    //don't use var because it doesn't follow concept of scope i.e can't name a variable with same name in inner scope with an outer scope
    let variable1 =3;
    console.log(variable1);

    let calculation = 2+2;
    console.log(calculation);
    
    let message='hello';
    console.log(message+2);

    console.log(typeof message);
  </script>
  
</body>
</html>
