<!--Boolean & if statements-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boolean & if statements</title>
</head>
<body>
  
  <script>

    console.log(5 == '5.00') 
    //true because  converts them into the same type but === will output false(so === is preferred because it's more accurate). same with !==/!=

    //have lower precedence than arithmetic operations

    //truthy & falsy values
    if(5) {
      console.log('truthy');
    }
    if(0) {
      console.log('falsy'); //others are; false,0,'',NaN, undefined,null
    }
    //NaN = invalid math i.e 'text'/ 5
    //undefined = a variable with no value i.e let name;
  </script>
</body>
</html>
