<!--Objects-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objects</title>
</head>
<body>
  
  <script>
    //reasons for objects; allow to group & use multiple values together
    //why use bracket notation? when you have a property with - i.e delivery-time. JS confuses it with minus
    //object+ function = method
    //JSON -> JavaScript Object Notation i.e
    // {
    //   "name": "shirt",
    //   "delivery-name": "1day",
    //   "rating": {
    //     "stars": 4.5,
    //     "count": 87
    //   } 
    // }
    //does not support functions. it's understood by every programming language. used when data is sent between computers & storing data
    ///built-in JSON converts JS to JSON
    //JSON typeof === string
    //local storage = allows to store data in variables permanently

    //objects are references; the property & value is stored in memory then the person name points to it
    //i.e
    const person = {
      name:'nadifa',

    };
    const object2 = person; //copy of reference(person(Obj)) that points to the data(name) in person(object)

    //properties of references
    //1. changes the name despite it being a const this is because it just points & doesn't containe actual name
    person.name='mary';
    console.log(person); 

    //2. even object2 changes
    console.log(object2); 

    //3. can't compare objects directly i.e
    const object3 = {
      name:"mary"

    };
    console.log(object3 === person); //this will output false even though the data inside is same. this is becuase this comparison is comparing the references only so not equal(was not set to be equal)

    console.log(object2 === person); ///but this is true because they were equated above(point to the same obj in memory) so the references are the same.

    //4. destructuring- do it if the variable has the same name as the object property
    //const name = object3.name; 
    const { name } = object3; //this is destructuring
    console.log(name);
    //another example of destructuring
    const object4 = {
      //name:name
      name,
      // method: function function1() {
      //   console.log('method');
      // }
      //the below is called shorthand method  from above method
      method() {
        console.log('method');
      }
    };
    console.log(object4.name);
    object4.method();

    // const product = {
    //   name:'socks',
    //   price:1090

    // };
    // console.log(product);
    // console.log(product.name);

    // product.name = 'shirt'; //changes name value to shirt
    // console.log(product);

    // //to add new property
    // product.rates = '5';
    // console.log(product);

    // //delete propert
    // delete product.rates;
    // console.log(product);

    const product2 = {
      name:'shirt',
      'delivery-time': '1 day', //another way to add a property
      rating: {
        stars: 4.5,
        count: 87
      }, // this is an obj within an object
      fun: function function1() {
        console.log('function inside object');
      }
    }
    console.log(product2['name']); //bracker notation
    console.log(product2.rating.stars);
    product2.fun();

    console.log(product2['delivery-time']); 

    //console is an obj
    console.log(typeof console);
    console.log(typeof console.log);//a function

    //JSON
    console.log(JSON.stringify(product2)); //converts to JSON.

    const jsonString = JSON.parse(JSON.stringify(product2));//JSON -> JS obj
    console.log(jsonString);

    //Auto-Boxing; 
    // doesn't work with undefined & null
    // wraps strings to a special object thus use methods i.e
    console.log('hello'.length); //5


  </script>
</body>
</html>
