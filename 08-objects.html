<!--Objects-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Objects</title>
</head>
<body>
  
  <script>
    const product = {
      name:'socks',
      price:1090

    };
    console.log(product);
    console.log(product.name);

    product.name = 'shirt'; //changes name value to shirt
    console.log(product);

    //to add new property
    product.rates = '5';
    console.log(product);

    //delete propert
    delete product.rates;
    console.log(product);

    //reasons for objects; allow to group & use multiple values together

  </script>
</body>
</html>
